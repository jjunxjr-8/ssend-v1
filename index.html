<!DOCTYPE html>
<html lang="en" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>5x5 Matrix Keypad</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Disables scrolling while dragging fingers across keys */
        }

        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none;
        }

        /* High-contrast Key & Button Styles */
        .interactive-btn {
            position: relative;
            background: #1e293b;
            border: 2px solid #334155;
            transition: background-color 0.05s ease, border-color 0.05s ease, transform 0.05s ease, box-shadow 0.05s ease;
        }

        /* Drag-hover state (highlighted while finger moves over key) */
        .interactive-btn.drag-hover {
            background-color: #4f46e5 !important; /* Indigo-600 */
            border-color: #a5b4fc !important;     /* Indigo-300 */
            transform: scale(0.97);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.7);
            z-index: 30;
        }

        /* Active release click pulse effect */
        .interactive-btn.active-click {
            background-color: #059669 !important; /* Emerald-600 */
            border-color: #6ee7b7 !important;
            transform: scale(0.94);
        }

        /* Blinking cursor effect */
        .cursor-blink {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Vertical orientation styling for edge space buttons */
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
    </style>
</head>
<body class="h-screen w-screen bg-slate-950 text-slate-100 flex flex-col p-2 sm:p-3 gap-2 sm:gap-3 overflow-hidden select-none">

    <!-- TOP HEADER BAR: Single Text Output Display & Control Buttons -->
    <header class="flex-none bg-slate-900 border-2 border-slate-800 rounded-2xl p-2 sm:p-3 flex items-center justify-between gap-2 shadow-2xl">
        
        <!-- Text Result Display Box -->
        <div class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 sm:py-3 flex items-center overflow-x-auto min-w-0">
            <span id="outputDisplay" class="font-mono text-2xl sm:text-4xl font-extrabold tracking-wider text-emerald-400 whitespace-pre font-mono"></span>
            <span class="w-3 h-7 sm:h-9 bg-emerald-400 inline-block ml-1 rounded-sm cursor-blink flex-none"></span>
        </div>

        <!-- Compact Backspace, Clear & Send Buttons -->
        <div class="flex items-center gap-2 flex-none">
            <!-- Backspace Button -->
            <button id="btnBackspace" 
                    class="interactive-btn h-11 sm:h-14 px-3 sm:px-5 bg-slate-800 border-slate-700 rounded-xl font-mono font-bold text-amber-400 flex items-center justify-center gap-1.5"
                    data-action="BACKSPACE" 
                    data-speech="backspace">
                <i class="fa-solid fa-delete-left text-lg sm:text-xl pointer-events-none"></i>
                <span class="hidden sm:inline font-bold text-xs pointer-events-none">DEL</span>
            </button>

            <!-- Clear Button -->
            <button id="btnClear" 
                    class="interactive-btn h-11 sm:h-14 px-3 sm:px-5 bg-red-950/70 border-red-800 rounded-xl font-mono font-black text-red-400 text-sm sm:text-base flex items-center justify-center"
                    data-action="CLEAR" 
                    data-speech="clear">
                <span class="pointer-events-none">CLR</span>
            </button>

            <!-- Send Button -->
            <button id="btnSend" 
                    class="interactive-btn h-11 sm:h-14 px-3 sm:px-5 bg-emerald-950/80 border-emerald-700 rounded-xl font-mono font-bold text-emerald-400 flex items-center justify-center gap-1.5 hover:bg-emerald-800/80"
                    data-action="SEND" 
                    data-speech="send">
                <i class="fa-solid fa-paper-plane text-lg sm:text-xl pointer-events-none"></i>
                <span class="hidden sm:inline font-bold text-xs pointer-events-none">SEND</span>
            </button>
        </div>
    </header>

    <!-- MAIN KEYPAD REGION: Edge Space Buttons + Center 5x5 Grid -->
    <main class="flex-1 flex gap-2 sm:gap-3 w-full h-full min-h-0">

        <!-- LEFT EDGE SPACE BUTTON -->
        <button class="interactive-btn w-12 sm:w-20 lg:w-24 h-full rounded-2xl bg-indigo-950/40 border-indigo-800/80 flex flex-col items-center justify-center gap-3 text-indigo-300 hover:text-white flex-none"
                data-char=" " 
                data-speech="space" 
                data-action="SPACE">
            <i class="fa-solid fa-arrows-left-right text-xl sm:text-2xl pointer-events-none"></i>
            <span class="font-black text-xs sm:text-base tracking-widest vertical-text rotate-180 pointer-events-none">SPACE</span>
            <i class="fa-solid fa-arrows-left-right text-xl sm:text-2xl pointer-events-none"></i>
        </button>

        <!-- CENTER 5x5 KEYPAD GRID -->
        <div id="gridContainer" class="flex-1 grid grid-cols-5 grid-rows-5 gap-2 sm:gap-3 w-full h-full">

            <!-- Row 1: A, B, C, D, E -->
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="A" data-speech="a" data-x="1" data-y="1">
                <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight pointer-events-none">A</span>
                <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-0.5 pointer-events-none">(1,1)</span>
            </button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="B" data-speech="b" data-x="2" data-y="1">

            </button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="E" data-speech="e" data-x="5" data-y="1">
                <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight pointer-events-none">E</span>
                <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-0.5 pointer-events-none">(5,1)</span>

            </button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="G" data-speech="g" data-x="2" data-y="2">

                <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-0.5 pointer-events-none">(2,2)</span>
            </button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="H" data-speech="h" data-x="3" data-y="2">
                <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight pointer-events-none">H</span>
                <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-0.5 pointer-events-none">(3,2)</span>
            </button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="I" data-speech="i" data-x="4" data-y="2">
                <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight pointer-events-none">I</span>
                <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-0.5 pointer-events-none">(4,2)</span>
            </button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="J" data-speech="j" data-x="5" data-y="2">
                <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight pointer-events-none">J</span>
                <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-0.5 pointer-events-none">(5,2)</span>
            </button>

            <!-- Row 3: L, M, N, O, P -->
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="L" data-speech="l" data-x="1" data-y="3">
                <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight pointer-events-none">L</span>
                <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-0.5 pointer-events-none">(1,3)</span>
            </button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="M" data-speech="m" data-x="2" data-y="3">
                <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight pointer-events-none">M</span>
                <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-0.5 pointer-events-none">(2,3)</span>
            </button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="N" data-speech="n" data-x="3" data-y="3">
                <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight pointer-events-none">N</span>
                <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-0.5 pointer-events-none">(3,3)</span>
            </button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="O" data-speech="o" data-x="4" data-y="3">
                <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight pointer-events-none">O</span>

            </button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="P" data-speech="p" data-x="5" data-y="3">
                <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight pointer-events-none">P</span>

            </button>

            <!-- Row 4: Q, R, S, T, U -->
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="Q" data-speech="q" data-x="1" data-y="4">

            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="R" data-speech="r" data-x="2" data-y="4">

            </button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="S" data-speech="s" data-x="3" data-y="4">
                <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight pointer-events-none">S</span>
                <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-0.5 pointer-events-none">(3,4)</span>
            </button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="T" data-speech="t" data-x="4" data-y="4">
                <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight pointer-events-none">T</span>
                <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-0.5 pointer-events-none">(4,4)</span>
            </button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="U" data-speech="u" data-x="5" data-y="4">
                <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight pointer-events-none">U</span>
                <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-0.5 pointer-events-none">(5,4)</span>
            </button>

            <!-- Row 5: V, W, X, Y, Z -->
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="V" data-speech="v" data-x="1" data-y="5">
                <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight pointer-events-none">V</span>
                <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-0.5 pointer-events-none">(1,5)</span>
            </button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="W" data-speech="w" data-x="2" data-y="5">
                <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight pointer-events-none">W</span>
                <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-0.5 pointer-events-none">(2,5)</span>
            </button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="X" data-speech="x" data-x="3" data-y="5">
                <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight pointer-events-none">X</span>
                <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-0.5 pointer-events-none">(3,5)</span>
            </button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="Y" data-speech="y" data-x="4" data-y="5">
                <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight pointer-events-none">Y</span>
                <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-0.5 pointer-events-none">(4,5)</span>
            </button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="Z" data-speech="z" data-x="5" data-y="5">
                <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight pointer-events-none">Z</span>
                <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-0.5 pointer-events-none">(5,5)</span>
            </button>
        </div>

        <!-- RIGHT EDGE SPACE BUTTON -->
        <button class="interactive-btn w-12 sm:w-20 lg:w-24 h-full rounded-2xl bg-indigo-950/40 border-indigo-800/80 flex flex-col items-center justify-center gap-3 text-indigo-300 hover:text-white flex-none"
                data-char=" " 
                data-speech="space" 
                data-action="SPACE">
            <i class="fa-solid fa-arrows-left-right text-xl sm:text-2xl pointer-events-none"></i>
            <span class="font-black text-xs sm:text-base tracking-widest vertical-text pointer-events-none">SPACE</span>
            <i class="fa-solid fa-arrows-left-right text-xl sm:text-2xl pointer-events-none"></i>
        </button>

    </main>

    <script>
        let typedText = "";
        let isPointerDown = false;
        let currentHighlightedBtn = null;

        const displayEl = document.getElementById('outputDisplay');

        /**
         * Web Speech API TTS helper
         * @param {string} text - Character or word string to pronounce
         * @param {boolean} cancelPrevious - Immediately cancel preceding spoken audio
         */
        function speak(text, cancelPrevious = true) {
            if (!('speechSynthesis' in window) || !text) return;
            
            if (cancelPrevious) {
                window.speechSynthesis.cancel();
            }

            // CRITICAL: Ensure characters are lowercase (e.g., 'a', 'g') so Speech Synthesis
            // pronounces only the letter sound rather than saying "Capital A" or "Capital G".
            let speechString = text.toLowerCase().trim();
            
            // If empty string (such as space), convert to literal word "space"
            if (speechString === '' || text === ' ') {
                speechString = 'space';
            }

            const utterance = new SpeechSynthesisUtterance(speechString);
            utterance.rate = 1.25;  // Slightly accelerated rate for snappy feedback
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            
            window.speechSynthesis.speak(utterance);
        }

        function sendQuery() {
            if (!typedText.trim()) return;
            const targetUrl = `https://scottfree.vercel.app/?q=${encodeURIComponent(typedText)}`;
            window.location.href = targetUrl;
        }

        function updateDisplay() {
            displayEl.innerText = typedText;
            const container = displayEl.parentElement;
            container.scrollLeft = container.scrollWidth;
        }

        function getButtonFromPoint(clientX, clientY) {
            const target = document.elementFromPoint(clientX, clientY);
            if (!target) return null;
            return target.closest('.interactive-btn');
        }

        function setHighlight(btn) {
            if (currentHighlightedBtn === btn) return;

            if (currentHighlightedBtn) {
                currentHighlightedBtn.classList.remove('drag-hover');
            }

            currentHighlightedBtn = btn;

            if (currentHighlightedBtn) {
                currentHighlightedBtn.classList.add('drag-hover');
                
                // Read out what character/action finger is currently hovering over
                const speechText = currentHighlightedBtn.getAttribute('data-speech') || currentHighlightedBtn.getAttribute('data-char');
                if (speechText) {
                    speak(speechText, true);
                }
            }
        }

        function onPointerDown(e) {
            isPointerDown = true;
            const btn = getButtonFromPoint(e.clientX, e.clientY);
            setHighlight(btn);
        }

        function onPointerMove(e) {
            if (!isPointerDown) return;
            const btn = getButtonFromPoint(e.clientX, e.clientY);
            setHighlight(btn);
        }

        function onPointerUp(e) {
            if (!isPointerDown) return;

            const btn = getButtonFromPoint(e.clientX, e.clientY);

            if (btn) {
                const action = btn.getAttribute('data-action');
                const char = btn.getAttribute('data-char');
                const speechText = btn.getAttribute('data-speech');

                // 1. Process character insertion or action execution
                if (action === 'BACKSPACE') {
                    typedText = typedText.slice(0, -1);
                } else if (action === 'CLEAR') {
                    typedText = '';
                } else if (action === 'SEND') {
                    if (speechText) speak(speechText, false);
                    sendQuery();
                    return;
                } else if (char !== null) {
                    typedText += char;
                }

                updateDisplay();

                // 2. Speak the letter or action name ONE MORE TIME upon release confirmation
                if (speechText) {
                    speak(speechText, false);
                }

                // 3. Trigger pulse feedback animation
                btn.classList.add('active-click');
                setTimeout(() => {
                    btn.classList.remove('active-click');
                }, 130);
            }

            // Reset interaction states
            setHighlight(null);
            isPointerDown = false;
        }

        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointercancel', () => {
            isPointerDown = false;
            setHighlight(null);
        });

        window.addEventListener('keydown', (e) => {
            if (e.altKey || e.ctrlKey || e.metaKey) return;

            const key = e.key.toUpperCase();

            if (/^[A-Z]$/.test(key)) {
                if (key === 'K') return; // Omit 'K' for 5x5 layout
                typedText += key;
                updateDisplay();
                speak(key.toLowerCase(), true);

                const btn = document.querySelector(`.key-btn[data-char="${key}"]`);
                if (btn) {
                    btn.classList.add('active-click');
                    setTimeout(() => btn.classList.remove('active-click'), 150);
                }
            } else if (e.key === ' ') {
                e.preventDefault();
                typedText += ' ';
                updateDisplay();
                speak('space', true);
            } else if (e.key === 'Backspace') {
                typedText = typedText.slice(0, -1);
                updateDisplay();
                speak('backspace', true);
            } else if (e.key === 'Escape') {
                typedText = '';
                updateDisplay();
                speak('clear', true);
            } else if (e.key === 'Enter') {
                speak('send', true);
                sendQuery();
            }
        });
    </script>
</body>
</html>
