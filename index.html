<!DOCTYPE html>
<html lang="en" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>5x5 Matrix Keypad - Sender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MQTT WebSocket Library -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        * { user-select: none; -webkit-user-select: none; }
        body { font-family: 'Inter', sans-serif; overscroll-behavior: none; }
        .interactive-btn {
            position: relative; background: #1e293b; border: 2px solid #334155;
            transition: background-color 0.05s ease, border-color 0.05s ease, transform 0.05s ease;
            touch-action: none;
        }
        .interactive-btn.drag-hover {
            background-color: #4f46e5 !important; border-color: #a5b4fc !important;
            transform: scale(0.97); box-shadow: 0 0 25px rgba(99, 102, 241, 0.7); z-index: 30;
        }
        .interactive-btn.active-click {
            background-color: #059669 !important; border-color: #6ee7b7 !important; transform: scale(0.94);
        }
        .vertical-text { writing-mode: vertical-rl; text-orientation: mixed; }
    </style>
</head>
<body class="h-screen w-screen bg-slate-950 text-slate-100 flex flex-col p-2 sm:p-3 gap-2 sm:gap-3 overflow-hidden select-none">

    <!-- TOP HEADER BAR -->
    <header class="flex-none bg-slate-900 border-2 border-slate-800 rounded-2xl p-2 sm:p-3 flex items-center justify-between gap-2 shadow-2xl">
        
        <!-- Connection Status & Room Code -->
        <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 flex-none">
            <span id="statusDot" class="w-3 h-3 rounded-full bg-amber-500 animate-pulse"></span>
            <span id="statusText" class="font-mono text-xs font-bold text-slate-400 uppercase">Connecting...</span>
        </div>

        <!-- Editable Output Display Input -->
        <div class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-1 sm:py-2 flex items-center min-w-0 focus-within:border-emerald-500 transition-colors">
            <input 
                id="outputDisplay" 
                type="text" 
                autocomplete="off" 
                autocorrect="off" 
                autocapitalize="characters" 
                spellcheck="false" 
                placeholder="TYPE HERE..."
                class="w-full bg-transparent font-mono text-xl sm:text-3xl font-extrabold tracking-wider text-emerald-400 focus:outline-none uppercase placeholder:text-slate-700"
            />
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-2 flex-none">
            <button id="btnBackspace" class="interactive-btn h-11 sm:h-14 px-3 sm:px-5 bg-slate-800 border-slate-700 rounded-xl font-mono font-bold text-amber-400 flex items-center justify-center gap-1.5" data-action="BACKSPACE" data-speech="backspace">
                <i class="fa-solid fa-delete-left text-lg sm:text-xl pointer-events-none"></i>
                <span class="hidden sm:inline font-bold text-xs pointer-events-none">DEL</span>
            </button>
            <button id="btnClear" class="interactive-btn h-11 sm:h-14 px-3 sm:px-5 bg-red-950/70 border-red-800 rounded-xl font-mono font-black text-red-400 text-sm sm:text-base flex items-center justify-center" data-action="CLEAR" data-speech="clear">
                <span class="pointer-events-none">CLR</span>
            </button>
            <button id="btnSend" class="interactive-btn h-11 sm:h-14 px-4 sm:px-6 bg-emerald-600 border-emerald-400 rounded-xl font-mono font-black text-white text-sm sm:text-base flex items-center justify-center gap-2 shadow-lg shadow-emerald-900/50" data-action="SEND" data-speech="send">
                <i class="fa-solid fa-paper-plane text-lg pointer-events-none"></i>
                <span class="pointer-events-none">SEND</span>
            </button>
        </div>
    </header>

    <!-- MAIN KEYPAD GRID -->
    <main class="flex-1 flex gap-2 sm:gap-3 w-full h-full min-h-0">
        <button class="interactive-btn w-12 sm:w-20 lg:w-24 h-full rounded-2xl bg-indigo-950/40 border-indigo-800/80 flex flex-col items-center justify-center gap-3 text-indigo-300 flex-none" data-char=" " data-speech="space" data-action="SPACE">
            <i class="fa-solid fa-arrows-left-right text-xl sm:text-2xl pointer-events-none"></i>
            <span class="font-black text-xs sm:text-base tracking-widest vertical-text rotate-180 pointer-events-none">SPACE</span>
        </button>

        <div id="gridContainer" class="flex-1 grid grid-cols-5 grid-rows-5 gap-2 sm:gap-3 w-full h-full">
            <!-- Row 1 -->
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="A" data-speech="a"><span class="text-3xl sm:text-5xl font-black pointer-events-none">A</span></button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="B" data-speech="b"><span class="text-3xl sm:text-5xl font-black pointer-events-none">B</span></button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="C" data-speech="c"><span class="text-3xl sm:text-5xl font-black pointer-events-none">C</span></button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="D" data-speech="d"><span class="text-3xl sm:text-5xl font-black pointer-events-none">D</span></button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="E" data-speech="e"><span class="text-3xl sm:text-5xl font-black pointer-events-none">E</span></button>
            <!-- Row 2 -->
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="F" data-speech="f"><span class="text-3xl sm:text-5xl font-black pointer-events-none">F</span></button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="G" data-speech="g"><span class="text-3xl sm:text-5xl font-black pointer-events-none">G</span></button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="H" data-speech="h"><span class="text-3xl sm:text-5xl font-black pointer-events-none">H</span></button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="I" data-speech="i"><span class="text-3xl sm:text-5xl font-black pointer-events-none">I</span></button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="J" data-speech="j"><span class="text-3xl sm:text-5xl font-black pointer-events-none">J</span></button>
            <!-- Row 3 -->
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="L" data-speech="l"><span class="text-3xl sm:text-5xl font-black pointer-events-none">L</span></button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="M" data-speech="m"><span class="text-3xl sm:text-5xl font-black pointer-events-none">M</span></button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="N" data-speech="n"><span class="text-3xl sm:text-5xl font-black pointer-events-none">N</span></button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="O" data-speech="o"><span class="text-3xl sm:text-5xl font-black pointer-events-none">O</span></button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="P" data-speech="p"><span class="text-3xl sm:text-5xl font-black pointer-events-none">P</span></button>
            <!-- Row 4 -->
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="Q" data-speech="q"><span class="text-3xl sm:text-5xl font-black pointer-events-none">Q</span></button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="R" data-speech="r"><span class="text-3xl sm:text-5xl font-black pointer-events-none">R</span></button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="S" data-speech="s"><span class="text-3xl sm:text-5xl font-black pointer-events-none">S</span></button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="T" data-speech="t"><span class="text-3xl sm:text-5xl font-black pointer-events-none">T</span></button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="U" data-speech="u"><span class="text-3xl sm:text-5xl font-black pointer-events-none">U</span></button>
            <!-- Row 5 -->
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="V" data-speech="v"><span class="text-3xl sm:text-5xl font-black pointer-events-none">V</span></button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="W" data-speech="w"><span class="text-3xl sm:text-5xl font-black pointer-events-none">W</span></button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="X" data-speech="x"><span class="text-3xl sm:text-5xl font-black pointer-events-none">X</span></button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="Y" data-speech="y"><span class="text-3xl sm:text-5xl font-black pointer-events-none">Y</span></button>
            <button class="interactive-btn key-btn rounded-2xl flex flex-col items-center justify-center" data-char="Z" data-speech="z"><span class="text-3xl sm:text-5xl font-black pointer-events-none">Z</span></button>
        </div>

        <button class="interactive-btn w-12 sm:w-20 lg:w-24 h-full rounded-2xl bg-indigo-950/40 border-indigo-800/80 flex flex-col items-center justify-center gap-3 text-indigo-300 flex-none" data-char=" " data-speech="space" data-action="SPACE">
            <i class="fa-solid fa-arrows-left-right text-xl sm:text-2xl pointer-events-none"></i>
            <span class="font-black text-xs sm:text-base tracking-widest vertical-text pointer-events-none">SPACE</span>
        </button>
    </main>

    <script>
        let isPointerDown = false;
        let currentHighlightedBtn = null;
        const displayEl = document.getElementById('outputDisplay');

        // Shared Room Topic
        const ROOM_TOPIC = "scottfree/live_queries/channel_1";
        
        // Connect to public WebSocket broker
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

        client.on('connect', () => {
            document.getElementById('statusDot').className = "w-3 h-3 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50";
            document.getElementById('statusText').innerText = "Online";
            document.getElementById('statusText').className = "font-mono text-xs font-bold text-emerald-400 uppercase";
        });

        client.on('offline', () => {
            document.getElementById('statusDot').className = "w-3 h-3 rounded-full bg-red-500";
            document.getElementById('statusText').innerText = "Offline";
            document.getElementById('statusText').className = "font-mono text-xs font-bold text-red-400 uppercase";
        });

        function sendQueryOverCloud() {
            const typedText = displayEl.value.trim();
            if (!typedText) return;
            
            const payload = JSON.stringify({
                text: typedText,
                timestamp: Date.now()
            });

            client.publish(ROOM_TOPIC, payload);
            
            // Visual feedback
            const sendBtn = document.getElementById('btnSend');
            sendBtn.classList.add('bg-emerald-400');
            setTimeout(() => sendBtn.classList.remove('bg-emerald-400'), 300);

            displayEl.value = "";
        }

        function speak(text) {
            if (!('speechSynthesis' in window) || !text) return;
            window.speechSynthesis.cancel();
            let speechString = text.toLowerCase().trim() || 'space';
            const utterance = new SpeechSynthesisUtterance(speechString);
            utterance.rate = 1.25;
            window.speechSynthesis.speak(utterance);
        }

        function getButtonFromPoint(clientX, clientY) {
            const target = document.elementFromPoint(clientX, clientY);
            return target ? target.closest('.interactive-btn') : null;
        }

        function setHighlight(btn) {
            if (currentHighlightedBtn === btn) return;
            if (currentHighlightedBtn) currentHighlightedBtn.classList.remove('drag-hover');
            currentHighlightedBtn = btn;
            if (currentHighlightedBtn) {
                currentHighlightedBtn.classList.add('drag-hover');
                const speechText = currentHighlightedBtn.getAttribute('data-speech') || currentHighlightedBtn.getAttribute('data-char');
                if (speechText) speak(speechText);
            }
        }

        // Pointer event handlers for screen button navigation
        window.addEventListener('pointerdown', (e) => { 
            // Prevent pointer capture if tapping input field directly
            if (e.target === displayEl) return;
            isPointerDown = true; 
            setHighlight(getButtonFromPoint(e.clientX, e.clientY)); 
        });

        window.addEventListener('pointermove', (e) => { 
            if (isPointerDown) setHighlight(getButtonFromPoint(e.clientX, e.clientY)); 
        });

        window.addEventListener('pointerup', (e) => {
            if (!isPointerDown) return;
            const btn = getButtonFromPoint(e.clientX, e.clientY);
            if (btn) {
                const action = btn.getAttribute('data-action');
                const char = btn.getAttribute('data-char');
                if (action === 'BACKSPACE') displayEl.value = displayEl.value.slice(0, -1);
                else if (action === 'CLEAR') displayEl.value = '';
                else if (action === 'SEND') sendQueryOverCloud();
                else if (char !== null) displayEl.value += char;
            }
            setHighlight(null);
            isPointerDown = false;
        });

        // Handle ENTER key submission from mobile / physical keyboards
        displayEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendQueryOverCloud();
            }
        });
    </script>
</body>
</html>
