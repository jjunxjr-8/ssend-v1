<!DOCTYPE html>
<html lang="en" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Sender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MQTT WebSocket Library -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        * { user-select: none; -webkit-user-select: none; }
        body { font-family: 'Inter', sans-serif; overscroll-behavior: none; }
        
        .big-btn {
            transition: all 0.15s ease-in-out;
            touch-action: manipulation;
        }
        .big-btn:active {
            transform: scale(0.96);
        }

        /* Pulsing animation while actively recording */
        @keyframes mic-pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 25px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording-active {
            background-color: #dc2626 !important;
            border-color: #fca5a5 !important;
            animation: mic-pulse 1.5s infinite;
        }
    </style>
</head>
<body class="h-screen w-screen bg-slate-950 text-slate-100 flex flex-col p-4 sm:p-6 gap-4 sm:gap-6 overflow-hidden select-none">

    <!-- TOP HEADER / DISPLAY BAR -->
    <header class="flex-none bg-slate-900 border-2 border-slate-800 rounded-2xl p-3 sm:p-4 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-2xl">
        
        <!-- Connection Status -->
        <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 flex-none self-start sm:self-auto">
            <span id="statusDot" class="w-3.5 h-3.5 rounded-full bg-amber-500 animate-pulse"></span>
            <span id="statusText" class="font-mono text-xs sm:text-sm font-bold text-slate-400 uppercase">Connecting...</span>
        </div>

        <!-- Editable Output Display Input -->
        <div class="w-full sm:flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 flex items-center min-w-0 focus-within:border-emerald-500 transition-colors">
            <input 
                id="outputDisplay" 
                type="text" 
                autocomplete="off" 
                autocorrect="off" 
                autocapitalize="characters" 
                spellcheck="false" 
                placeholder="PRESS VOICE TO SPEAK..."
                class="w-full bg-transparent font-mono text-2xl sm:text-4xl font-extrabold tracking-wider text-emerald-400 focus:outline-none uppercase placeholder:text-slate-700"
            />
            <button id="btnClear" class="text-slate-600 hover:text-red-400 px-2 text-xl font-bold transition-colors" title="Clear text">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </header>

    <!-- MAIN BUTTONS INTERFACE -->
    <main class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 w-full h-full min-h-0">
        
        <!-- Big Voice Button -->
        <button id="btnMic" class="big-btn h-full w-full bg-slate-900 hover:bg-slate-850 border-4 border-rose-600/60 rounded-3xl flex flex-col items-center justify-center gap-4 text-rose-400 shadow-2xl">
            <i id="micIcon" class="fa-solid fa-microphone text-6xl sm:text-8xl"></i>
            <span id="micText" class="font-black text-2xl sm:text-4xl tracking-wider uppercase">START VOICE</span>
        </button>

        <!-- Big Send Button -->
        <button id="btnSend" class="big-btn h-full w-full bg-emerald-600 hover:bg-emerald-500 border-4 border-emerald-400 rounded-3xl flex flex-col items-center justify-center gap-4 text-white shadow-2xl shadow-emerald-950/50">
            <i class="fa-solid fa-paper-plane text-6xl sm:text-8xl"></i>
            <span class="font-black text-2xl sm:text-4xl tracking-wider uppercase">SEND</span>
        </button>

    </main>

    <script>
        const displayEl = document.getElementById('outputDisplay');
        const btnClear = document.getElementById('btnClear');
        const btnMic = document.getElementById('btnMic');
        const micIcon = document.getElementById('micIcon');
        const micText = document.getElementById('micText');
        const btnSend = document.getElementById('btnSend');

        // Shared Room Topic
        const ROOM_TOPIC = "scottfree/live_queries/channel_1";
        
        // Connect to public WebSocket broker
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

        client.on('connect', () => {
            document.getElementById('statusDot').className = "w-3.5 h-3.5 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50";
            document.getElementById('statusText').innerText = "Online";
            document.getElementById('statusText').className = "font-mono text-xs sm:text-sm font-bold text-emerald-400 uppercase";
        });

        client.on('offline', () => {
            document.getElementById('statusDot').className = "w-3.5 h-3.5 rounded-full bg-red-500";
            document.getElementById('statusText').innerText = "Offline";
            document.getElementById('statusText').className = "font-mono text-xs sm:text-sm font-bold text-red-400 uppercase";
        });

        function sendQueryOverCloud() {
            const typedText = displayEl.value.trim();
            if (!typedText) return;
            
            const payload = JSON.stringify({
                text: typedText,
                timestamp: Date.now()
            });

            client.publish(ROOM_TOPIC, payload);
            
            // Visual feedback
            btnSend.classList.add('bg-emerald-400');
            setTimeout(() => btnSend.classList.remove('bg-emerald-400'), 300);

            displayEl.value = "";
        }

        /* VOICE RECOGNITION SETUP */
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                btnMic.classList.add('recording-active');
                btnMic.classList.remove('border-rose-600/60');
                micIcon.className = "fa-solid fa-microphone-lines text-6xl sm:text-8xl text-white";
                micText.innerText = "LISTENING...";
            };

            recognition.onresult = (event) => {
                let currentTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    currentTranscript += event.results[i][0].transcript;
                }
                displayEl.value = currentTranscript.toUpperCase();
            };

            recognition.onerror = (e) => {
                console.error("Speech recognition error:", e.error);
                stopListening();
            };

            recognition.onend = () => {
                if (isListening) {
                    try { recognition.start(); } catch (err) { stopListening(); }
                } else {
                    stopListening();
                }
            };
        } else {
            btnMic.classList.add('opacity-50', 'cursor-not-allowed');
            micText.innerText = "NOT SUPPORTED";
        }

        function startListening() {
            if (!recognition) return alert("Speech recognition is not supported in your browser.");
            isListening = true;
            recognition.start();
        }

        function stopListening() {
            isListening = false;
            if (recognition) recognition.stop();
            btnMic.classList.remove('recording-active');
            btnMic.classList.add('border-rose-600/60');
            micIcon.className = "fa-solid fa-microphone text-6xl sm:text-8xl";
            micText.innerText = "START VOICE";
        }

        btnMic.addEventListener('click', () => {
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        });

        btnSend.addEventListener('click', () => {
            sendQueryOverCloud();
        });

        btnClear.addEventListener('click', () => {
            displayEl.value = '';
        });

        // Handle ENTER key submission from physical / mobile keyboard
        displayEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendQueryOverCloud();
            }
        });
    </script>
</body>
</html>
