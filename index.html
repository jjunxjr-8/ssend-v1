<!DOCTYPE html>
<html lang="en" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>5x5 Matrix Keypad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Prevents page scroll while dragging fingers */
        }

        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none;
        }

        /* High-contrast Key Styles */
        .key-btn {
            position: relative;
            background: #1e293b;
            border: 2px solid #334155;
            transition: background-color 0.05s ease, border-color 0.05s ease, transform 0.05s ease;
        }

        /* Drag-hover state (highlighted while finger moves over key without typing) */
        .key-btn.drag-hover {
            background-color: #4f46e5 !important; /* Indigo-600 */
            border-color: #818cf8 !important;     /* Indigo-400 */
            transform: scale(0.98);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.6);
            z-index: 20;
        }

        .key-btn.active-click {
            background-color: #059669 !important; /* Emerald-600 pulse on release */
            border-color: #34d399 !important;
            transform: scale(0.95);
        }

        /* Blinking cursor effect */
        .cursor-blink {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="h-screen w-screen bg-slate-950 text-slate-100 flex flex-col p-2 sm:p-4 gap-2 sm:gap-3 overflow-hidden select-none">

    <!-- TOP BAR: Single Text Entry Field & Quick Action Buttons -->
    <header class="flex-none bg-slate-900 border-2 border-slate-800 rounded-2xl p-2 sm:p-3 flex items-center justify-between gap-2 shadow-2xl">
        
        <!-- Output Display Area -->
        <div class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 sm:py-3 flex items-center overflow-x-auto min-w-0">
            <span id="outputDisplay" class="font-mono text-2xl sm:text-4xl font-bold tracking-wider text-emerald-400 whitespace-nowrap"></span>
            <span class="w-3 h-7 sm:h-9 bg-emerald-400 inline-block ml-1 rounded-sm cursor-blink"></span>
        </div>

        <!-- Compact Control Buttons -->
        <div class="flex items-center gap-1.5 sm:gap-2 flex-none">
            <!-- Space Bar Button -->
            <button id="btnSpace" onclick="handleControl('SPACE')" class="h-11 sm:h-14 px-3 sm:px-5 bg-slate-800 hover:bg-slate-700 active:bg-indigo-600 border border-slate-700 rounded-xl font-mono font-bold text-xs sm:text-sm text-slate-200 flex items-center justify-center gap-1">
                <i class="fa-solid fa-arrows-left-right text-xs"></i>
                <span class="hidden sm:inline">SPACE</span>
            </button>

            <!-- Backspace Button -->
            <button id="btnBackspace" onclick="handleControl('BACKSPACE')" class="h-11 sm:h-14 px-3 sm:px-4 bg-slate-800 hover:bg-slate-700 active:bg-amber-600 border border-slate-700 rounded-xl font-mono font-bold text-amber-400 active:text-white flex items-center justify-center">
                <i class="fa-solid fa-delete-left text-lg sm:text-xl"></i>
            </button>

            <!-- Clear Button -->
            <button id="btnClear" onclick="handleControl('CLEAR')" class="h-11 sm:h-14 px-3 sm:px-4 bg-red-950/60 hover:bg-red-900 active:bg-red-600 border border-red-800/80 rounded-xl font-mono font-extrabold text-red-400 active:text-white text-sm sm:text-base flex items-center justify-center">
                CLR
            </button>
        </div>
    </header>

    <!-- FULL-SCREEN 5x5 KEYPAD GRID -->
    <main id="gridContainer" class="flex-1 grid grid-cols-5 grid-rows-5 gap-2 sm:gap-3 w-full h-full">
        <!-- Row 1: A, B, C, D, E -->
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="A" data-x="1" data-y="1">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">A</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(1,1)</span>
        </button>
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="B" data-x="2" data-y="1">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">B</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(2,1)</span>
        </button>
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="C" data-x="3" data-y="1">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">C</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(3,1)</span>
        </button>
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="D" data-x="4" data-y="1">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">D</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(4,1)</span>
        </button>
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="E" data-x="5" data-y="1">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">E</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(5,1)</span>
        </button>

        <!-- Row 2: F, G, H, I, J -->
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="F" data-x="1" data-y="2">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">F</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(1,2)</span>
        </button>
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="G" data-x="2" data-y="2">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">G</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(2,2)</span>
        </button>
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="H" data-x="3" data-y="2">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">H</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(3,2)</span>
        </button>
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="I" data-x="4" data-y="2">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">I</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(4,2)</span>
        </button>
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="J" data-x="5" data-y="2">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">J</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(5,2)</span>
        </button>

        <!-- Row 3: L, M, N, O, P -->
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="L" data-x="1" data-y="3">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">L</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(1,3)</span>
        </button>
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="M" data-x="2" data-y="3">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">M</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(2,3)</span>
        </button>
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="N" data-x="3" data-y="3">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">N</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(3,3)</span>
        </button>
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="O" data-x="4" data-y="3">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">O</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(4,3)</span>
        </button>
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="P" data-x="5" data-y="3">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">P</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(5,3)</span>
        </button>

        <!-- Row 4: Q, R, S, T, U -->
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="Q" data-x="1" data-y="4">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">Q</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(1,4)</span>
        </button>
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="R" data-x="2" data-y="4">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">R</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(2,4)</span>
        </button>
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="S" data-x="3" data-y="4">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">S</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(3,4)</span>
        </button>
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="T" data-x="4" data-y="4">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">T</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(4,4)</span>
        </button>
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="U" data-x="5" data-y="4">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">U</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(5,4)</span>
        </button>

        <!-- Row 5: V, W, X, Y, Z -->
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="V" data-x="1" data-y="5">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">V</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(1,5)</span>
        </button>
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="W" data-x="2" data-y="5">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">W</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(2,5)</span>
        </button>
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="X" data-x="3" data-y="5">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">X</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(3,5)</span>
        </button>
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="Y" data-x="4" data-y="5">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">Y</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(4,5)</span>
        </button>
        <button class="key-btn rounded-2xl flex flex-col items-center justify-center" data-char="Z" data-x="5" data-y="5">
            <span class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight">Z</span>
            <span class="text-[10px] sm:text-xs font-mono font-bold text-slate-400 mt-1">(5,5)</span>
        </button>
    </main>

    <script>
        // State variables
        let typedText = "";
        let isPointerDown = false;
        let currentHighlightedBtn = null;

        const displayEl = document.getElementById('outputDisplay');

        /**
         * Web Speech API TTS helper
         * @param {string} text - Character or word to speak out loud
         * @param {boolean} cancelPrevious - If true, immediately interrupts any ongoing speech
         */
        function speak(text, cancelPrevious = true) {
            if (!('speechSynthesis' in window)) return;
            
            if (cancelPrevious) {
                window.speechSynthesis.cancel();
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.2;  // Slightly faster speed for snappy UI response
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            
            window.speechSynthesis.speak(utterance);
        }

        // Update output text display
        function updateDisplay() {
            displayEl.innerText = typedText;
            const container = displayEl.parentElement;
            container.scrollLeft = container.scrollWidth;
        }

        // Add character to text
        function typeChar(char) {
            typedText += char;
            updateDisplay();
        }

        // Control actions (Space, Backspace, Clear)
        function handleControl(action) {
            if (action === 'SPACE') {
                typedText += ' ';
                speak('Space', true);
            } else if (action === 'BACKSPACE') {
                typedText = typedText.slice(0, -1);
                speak('Backspace', true);
            } else if (action === 'CLEAR') {
                typedText = '';
                speak('Clear', true);
            }
            updateDisplay();
        }

        // Helper: Find button element under coordinate point (X,Y)
        function getButtonFromPoint(clientX, clientY) {
            const target = document.elementFromPoint(clientX, clientY);
            if (!target) return null;
            return target.closest('.key-btn');
        }

        // Set visual highlight on currently dragged key & trigger voice readout on hover
        function setHighlight(btn) {
            if (currentHighlightedBtn === btn) return;

            if (currentHighlightedBtn) {
                currentHighlightedBtn.classList.remove('drag-hover');
            }

            currentHighlightedBtn = btn;

            if (currentHighlightedBtn) {
                currentHighlightedBtn.classList.add('drag-hover');
                const char = currentHighlightedBtn.getAttribute('data-char');
                if (char) {
                    // Speak the letter immediately when finger moves over key
                    speak(char, true);
                }
            }
        }

        // Pointer Event Handlers for Drag, Hover Readout & Release Entry
        function onPointerDown(e) {
            isPointerDown = true;
            const btn = getButtonFromPoint(e.clientX, e.clientY);
            setHighlight(btn);
        }

        function onPointerMove(e) {
            if (!isPointerDown) return;
            const btn = getButtonFromPoint(e.clientX, e.clientY);
            setHighlight(btn);
        }

        function onPointerUp(e) {
            if (!isPointerDown) return;

            const btn = getButtonFromPoint(e.clientX, e.clientY);

            if (btn) {
                const char = btn.getAttribute('data-char');
                
                // 1. Append typed character
                typeChar(char);

                // 2. Speak letter out loud ONE MORE TIME upon release
                speak(char, false);

                // 3. Visual pulse feedback on release
                btn.classList.add('active-click');
                setTimeout(() => {
                    btn.classList.remove('active-click');
                }, 120);
            }

            // Reset tracking states
            setHighlight(null);
            isPointerDown = false;
        }

        // Attach unified Pointer Events to window for seamless drag tracking across grid boundaries
        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointercancel', () => {
            isPointerDown = false;
            setHighlight(null);
        });

        // Physical Keyboard Support
        window.addEventListener('keydown', (e) => {
            if (e.altKey || e.ctrlKey || e.metaKey) return;

            const key = e.key.toUpperCase();

            if (/^[A-Z]$/.test(key)) {
                if (key === 'K') return; // Skips 'K' as required by 5x5 layout
                typeChar(key);
                speak(key, true);

                // Highlight corresponding button on screen briefly
                const btn = document.querySelector(`.key-btn[data-char="${key}"]`);
                if (btn) {
                    btn.classList.add('active-click');
                    setTimeout(() => btn.classList.remove('active-click'), 150);
                }
            } else if (e.key === ' ') {
                e.preventDefault();
                handleControl('SPACE');
            } else if (e.key === 'Backspace') {
                handleControl('BACKSPACE');
            } else if (e.key === 'Escape') {
                handleControl('CLEAR');
            }
        });
    </script>
</body>
</html>
