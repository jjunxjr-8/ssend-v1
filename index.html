<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5x5 Coordinate Keypad</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Disables scrolling while dragging fingers across keys */
        }

        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none;
        }

        /* High-contrast Key & Button Styles */
        .interactive-btn {
            position: relative;
            background: #1e293b;
            border: 2px solid #334155;
            transition: background-color 0.05s ease, border-color 0.05s ease, transform 0.05s ease, box-shadow 0.05s ease;
        }

        /* Drag-hover state (highlighted while finger moves over key) */
        .interactive-btn.drag-hover {
            background-color: #4f46e5 !important; /* Indigo-600 */
            border-color: #a5b4fc !important;     /* Indigo-300 */
            transform: scale(0.97);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.7);
            z-index: 30;
        }

        /* Active release click pulse effect */
        .interactive-btn.active-click {
            background-color: #059669 !important; /* Emerald-600 */
            border-color: #6ee7b7 !important;
            transform: scale(0.94);
        }

        /* Blinking cursor effect */
        .cursor-blink {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Vertical orientation styling for edge space buttons */
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
    </style>
</head>
<body class="h-screen w-screen bg-slate-950 text-slate-100 flex items-center justify-center p-3 sm:p-6 overflow-hidden select-none">

    <div class="w-full max-w-lg sm:max-w-xl bg-slate-900/90 border-2 border-slate-800/80 rounded-3xl p-3 sm:p-5 flex flex-col gap-3 shadow-2xl backdrop-blur-sm">

        <header class="bg-slate-950/80 border border-slate-800 rounded-2xl p-2 sm:p-2.5 flex items-center justify-between gap-2">
            
            <!-- Text Result Display Box -->
            <div class="flex-1 bg-slate-950 border border-slate-800/80 rounded-xl px-3 py-1.5 sm:py-2 flex items-center overflow-x-auto min-w-0 h-11 sm:h-13">
                <span id="outputDisplay" class="font-mono text-xl sm:text-3xl font-extrabold tracking-wider text-emerald-400 whitespace-pre"></span>
                <span class="w-2.5 h-6 sm:h-8 bg-emerald-400 inline-block ml-1 rounded-sm cursor-blink flex-none"></span>
            </div>

            <!-- Compact Backspace & Clear Buttons -->
            <div class="flex items-center gap-1.5 flex-none">
                <!-- Backspace Button -->
                <button id="btnBackspace" 
                        class="interactive-btn h-11 sm:h-13 px-3 sm:px-4 bg-slate-800 border-slate-700 rounded-xl font-mono font-bold text-amber-400 flex items-center justify-center gap-1.5"
                        data-action="BACKSPACE" 
                        data-speech="backspace">
                    <i class="fa-solid fa-delete-left text-base sm:text-lg pointer-events-none"></i>
                    <span class="hidden sm:inline font-bold text-xs pointer-events-none">DEL</span>
                </button>

                <!-- Clear Button -->
                <button id="btnClear" 
                        class="interactive-btn h-11 sm:h-13 px-3 sm:px-4 bg-red-950/70 border-red-800 rounded-xl font-mono font-black text-red-400 text-xs sm:text-sm flex items-center justify-center"
                        data-action="CLEAR" 
                        data-speech="clear">
                    <span class="pointer-events-none">CLR</span>
                </button>
            </div>
        </header>

        <main class="flex gap-2 sm:gap-2.5 w-full items-stretch">

            <!-- LEFT EDGE SPACE BUTTON -->
            <button class="interactive-btn w-10 sm:w-14 rounded-2xl bg-indigo-950/50 border-indigo-800/80 flex flex-col items-center justify-center gap-2 text-indigo-300 hover:text-white flex-none py-2"
                    data-char=" " 
                    data-speech="space" 
                    data-action="SPACE">
                <i class="fa-solid fa-arrows-left-right text-sm sm:text-base pointer-events-none"></i>
                <span class="font-black text-[10px] sm:text-xs tracking-widest vertical-text rotate-180 pointer-events-none">SPACE</span>
                <i class="fa-solid fa-arrows-left-right text-sm sm:text-base pointer-events-none"></i>
            </button>

            <!-- CENTER 5x5 KEYPAD GRID -->
            <div id="gridContainer" class="flex-1 grid grid-cols-5 grid-rows-5 gap-1.5 sm:gap-2 w-full aspect-square">

                <!-- Row 1: A, B, C, D, E -->
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="A" data-speech="a" data-x="1" data-y="1">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">A</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(1,1)</span>
                </button>
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="B" data-speech="b" data-x="2" data-y="1">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">B</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(2,1)</span>
                </button>
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="C" data-speech="c" data-x="3" data-y="1">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">C</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(3,1)</span>
                </button>
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="D" data-speech="d" data-x="4" data-y="1">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">D</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(4,1)</span>
                </button>
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="E" data-speech="e" data-x="5" data-y="1">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">E</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(5,1)</span>
                </button>

                <!-- Row 2: F, G, H, I, J -->
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="F" data-speech="f" data-x="1" data-y="2">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">F</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(1,2)</span>
                </button>
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="G" data-speech="g" data-x="2" data-y="2">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">G</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(2,2)</span>
                </button>
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="H" data-speech="h" data-x="3" data-y="2">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">H</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(3,2)</span>
                </button>
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="I" data-speech="i" data-x="4" data-y="2">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">I</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(4,2)</span>
                </button>
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="J" data-speech="j" data-x="5" data-y="2">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">J</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(5,2)</span>
                </button>

                <!-- Row 3: L, M, N, O, P -->
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="L" data-speech="l" data-x="1" data-y="3">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">L</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(1,3)</span>
                </button>
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="M" data-speech="m" data-x="2" data-y="3">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">M</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(2,3)</span>
                </button>
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="N" data-speech="n" data-x="3" data-y="3">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">N</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(3,3)</span>
                </button>
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="O" data-speech="o" data-x="4" data-y="3">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">O</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(4,3)</span>
                </button>
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="P" data-speech="p" data-x="5" data-y="3">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">P</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(5,3)</span>
                </button>

                <!-- Row 4: Q, R, S, T, U -->
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="Q" data-speech="q" data-x="1" data-y="4">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">Q</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(1,4)</span>
                </button>
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="R" data-speech="r" data-x="2" data-y="4">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">R</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(2,4)</span>
                </button>
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="S" data-speech="s" data-x="3" data-y="4">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">S</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(3,4)</span>
                </button>
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="T" data-speech="t" data-x="4" data-y="4">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">T</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(4,4)</span>
                </button>
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="U" data-speech="u" data-x="5" data-y="4">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">U</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(5,4)</span>
                </button>

                <!-- Row 5: V, W, X, Y, Z -->
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="V" data-speech="v" data-x="1" data-y="5">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">V</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(1,5)</span>
                </button>
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="W" data-speech="w" data-x="2" data-y="5">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">W</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(2,5)</span>
                </button>
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="X" data-speech="x" data-x="3" data-y="5">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">X</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(3,5)</span>
                </button>
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="Y" data-speech="y" data-x="4" data-y="5">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">Y</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(4,5)</span>
                </button>
                <button class="interactive-btn key-btn rounded-xl sm:rounded-2xl flex flex-col items-center justify-center p-1" data-char="Z" data-speech="z" data-x="5" data-y="5">
                    <span class="text-xl sm:text-3xl font-black tracking-tight pointer-events-none">Z</span>
                    <span class="text-[9px] sm:text-[11px] font-mono font-bold text-slate-400 pointer-events-none">(5,5)</span>
                </button>
            </div>

            <!-- RIGHT EDGE SPACE BUTTON -->
            <button class="interactive-btn w-10 sm:w-14 rounded-2xl bg-indigo-950/50 border-indigo-800/80 flex flex-col items-center justify-center gap-2 text-indigo-300 hover:text-white flex-none py-2"
                    data-char=" " 
                    data-speech="space" 
                    data-action="SPACE">
                <i class="fa-solid fa-arrows-left-right text-sm sm:text-base pointer-events-none"></i>
                <span class="font-black text-[10px] sm:text-xs tracking-widest vertical-text pointer-events-none">SPACE</span>
                <i class="fa-solid fa-arrows-left-right text-sm sm:text-base pointer-events-none"></i>
            </button>

        </main>
    </div>

    <script>
        let typedText = "";
        let isPointerDown = false;
        let currentHighlightedBtn = null;

        const displayEl = document.getElementById('outputDisplay');

        /**
         * Web Speech API TTS helper
         * @param {string} text - Character or word string to pronounce
         * @param {boolean} cancelPrevious - Immediately cancel preceding spoken audio
         */
        function speak(text, cancelPrevious = true) {
            if (!('speechSynthesis' in window) || !text) return;
            
            if (cancelPrevious) {
                window.speechSynthesis.cancel();
            }

            // CRITICAL: Ensure characters are lowercase (e.g., 'a', 'g') so Speech Synthesis
            // pronounces only the letter sound rather than saying "Capital A" or "Capital G".
            let speechString = text.toLowerCase().trim();
            
            // If empty string (such as space), convert to literal word "space"
            if (speechString === '' || text === ' ') {
                speechString = 'space';
            }

            const utterance = new SpeechSynthesisUtterance(speechString);
            utterance.rate = 1.25;  // Slightly accelerated rate for snappy feedback
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            
            window.speechSynthesis.speak(utterance);
        }

        function updateDisplay() {
            displayEl.innerText = typedText;
            const container = displayEl.parentElement;
            container.scrollLeft = container.scrollWidth;
        }

        function getButtonFromPoint(clientX, clientY) {
            const target = document.elementFromPoint(clientX, clientY);
            if (!target) return null;
            return target.closest('.interactive-btn');
        }

        function setHighlight(btn) {
            if (currentHighlightedBtn === btn) return;

            if (currentHighlightedBtn) {
                currentHighlightedBtn.classList.remove('drag-hover');
            }

            currentHighlightedBtn = btn;

            if (currentHighlightedBtn) {
                currentHighlightedBtn.classList.add('drag-hover');
                
                // Read out what character/action finger is currently hovering over
                const speechText = currentHighlightedBtn.getAttribute('data-speech') || currentHighlightedBtn.getAttribute('data-char');
                if (speechText) {
                    speak(speechText, true);
                }
            }
        }

        function onPointerDown(e) {
            isPointerDown = true;
            const btn = getButtonFromPoint(e.clientX, e.clientY);
            setHighlight(btn);
        }

        function onPointerMove(e) {
            if (!isPointerDown) return;
            const btn = getButtonFromPoint(e.clientX, e.clientY);
            setHighlight(btn);
        }

        function onPointerUp(e) {
            if (!isPointerDown) return;

            const btn = getButtonFromPoint(e.clientX, e.clientY);

            if (btn) {
                const action = btn.getAttribute('data-action');
                const char = btn.getAttribute('data-char');
                const speechText = btn.getAttribute('data-speech');

                // 1. Process character insertion or action execution
                if (action === 'BACKSPACE') {
                    typedText = typedText.slice(0, -1);
                } else if (action === 'CLEAR') {
                    typedText = '';
                } else if (char !== null) {
                    typedText += char;
                }

                updateDisplay();

                // 2. Speak the letter or action name ONE MORE TIME upon release confirmation
                if (speechText) {
                    speak(speechText, false);
                }

                // 3. Trigger pulse feedback animation
                btn.classList.add('active-click');
                setTimeout(() => {
                    btn.classList.remove('active-click');
                }, 130);
            }

            // Reset interaction states
            setHighlight(null);
            isPointerDown = false;
        }

        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointercancel', () => {
            isPointerDown = false;
            setHighlight(null);
        });

        window.addEventListener('keydown', (e) => {
            if (e.altKey || e.ctrlKey || e.metaKey) return;

            const key = e.key.toUpperCase();

            if (/^[A-Z]$/.test(key)) {
                if (key === 'K') return; // Omit 'K' for 5x5 layout
                typedText += key;
                updateDisplay();
                speak(key.toLowerCase(), true);

                const btn = document.querySelector(`.key-btn[data-char="${key}"]`);
                if (btn) {
                    btn.classList.add('active-click');
                    setTimeout(() => btn.classList.remove('active-click'), 150);
                }
            } else if (e.key === ' ') {
                e.preventDefault();
                typedText += ' ';
                updateDisplay();
                speak('space', true);
            } else if (e.key === 'Backspace') {
                typedText = typedText.slice(0, -1);
                updateDisplay();
                speak('backspace', true);
            } else if (e.key === 'Escape') {
                typedText = '';
                updateDisplay();
                speak('clear', true);
            }
        });
    </script>
</body>
</html>
